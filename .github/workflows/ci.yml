name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          [ -z "$out" ] || { echo "::error::gofmt needed:"; echo "$out"; gofmt -d .; exit 1; }

      - run: go vet ./...

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go mod verify

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      # Run as a Go tool rather than a third-party action: one less external
      # dependency in the workflow that lints the workflows.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          for t in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS="${t%/*}" GOARCH="${t#*/}" go build -trimpath -o /dev/null ./cmd/zipshrink
          done

      - name: build windows exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o dist/zipshrink.exe ./cmd/zipshrink

      - uses: actions/upload-artifact@v7
        with:
          name: zipshrink-windows-amd64
          path: dist/zipshrink.exe
          if-no-files-found: error

  # Matrixed per OS because the truncator rewrites and truncates a file while
  # it is open for reading, and those semantics differ by platform.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go test -count=1 ./...

      - name: race and coverage
        if: runner.os == 'Linux'
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out -count=1 ./...
          go tool cover -func=coverage.out | tail -1

      # git archive keeps this free of any dependency checkout doesn't already
      # guarantee, and the small chunk forces several in-place shifts. Content
      # is asserted byte-exact by the unit tests; this covers the real binary.
      - name: CLI consumes the archive in place
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip HEAD -o smoke.zip
          want="$(git ls-files | wc -l | tr -d '[:space:]')"
          out="$(go run ./cmd/zipshrink -c 4KB -o smoke_out smoke.zip)"
          echo "$out"
          test ! -f smoke.zip
          echo "$out" | grep -q "Extracted $want files" \
            || { echo "::error::expected $want files extracted"; exit 1; }

      # The archive is a binary blob, so this comparison is immune to the
      # line-ending normalisation that makes text comparisons unreliable here.
      - name: -k leaves the archive byte-identical
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip HEAD -o keep.zip
          cp keep.zip reference.zip
          go run ./cmd/zipshrink -k -c 4KB -o keep_out keep.zip
          cmp keep.zip reference.zip

  # Seed corpora already run inside `go test`; this is the timed exploration,
  # kept off pull requests so they stay fast.
  fuzz:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./pkg/streamzip/ -run FuzzReader -fuzz FuzzReader -fuzztime 120s

      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus
          path: pkg/streamzip/testdata/fuzz
          if-no-files-found: ignore

  # The vulnerability database moves independently of this code, so this runs
  # on main and weekly rather than blocking every pull request.
  vuln:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golang/govulncheck-action@v1.1.0
