name: Release

on:
  push:
    # Coarse on purpose: the verify job enforces strict semver.
    tags: ["v*"]
  # Called by release-please: tags it creates with GITHUB_TOKEN cannot start
  # a workflow of their own, so it invokes this one directly.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach assets to.
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ inputs.tag || github.ref_name }}
      prerelease: ${{ steps.semver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: validate semver tag
        id: semver
        run: |
          set -euo pipefail
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! printf '%s' "$TAG" | grep -Eq "$re"; then
            echo "::error::tag '$TAG' is not semver (want vMAJOR.MINOR.PATCH[-prerelease][+build])"
            exit 1
          fi
          # Strip +build metadata first: a hyphen there is not a prerelease.
          if printf '%s' "${TAG%%+*}" | grep -q -- '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - run: go test -count=1 ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build and package
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p build dist
          # Both licences ship inside every archive: rardecode is BSD and
          # requires its notice to accompany binary redistribution.
          cp LICENSE THIRD_PARTY_LICENSES README.md build/
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${t%/*}"; goarch="${t#*/}"
            bin=zipshrink; [ "$goos" = windows ] && bin=zipshrink.exe
            name="zipshrink_${TAG}_${goos}_${goarch}"
            GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "build/$bin" ./cmd/zipshrink
            if [ "$goos" = windows ]; then
              (cd build && zip -q "../dist/${name}.zip" "$bin" LICENSE THIRD_PARTY_LICENSES README.md)
            else
              tar -czf "dist/${name}.tar.gz" -C build "$bin" LICENSE THIRD_PARTY_LICENSES README.md
            fi
            rm -f "build/$bin"
          done
          (cd dist && sha256sum zipshrink_* > SHA256SUMS)
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write # keyless cosign signing via the OIDC token
      attestations: write # SLSA build provenance
    env:
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: zipshrink-sbom.spdx.json
          output-file: dist/zipshrink-sbom.spdx.json

      - uses: sigstore/cosign-installer@v4

      # Signing the checksum file covers every artifact it lists, so one
      # signature is enough to verify the whole release.
      - name: sign checksums
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.cosign.bundle \
            dist/SHA256SUMS

      # Attests which workflow and commit produced these artifacts, something
      # the cosign signature does not cover. Verify with
      # `gh attestation verify <file> -R <repo>`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/zipshrink_*

      # release-please creates the release itself, so attach to an existing
      # one and only create it for a manual tag.
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=(--generate-notes)
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$TAG" dist/* "${flags[@]}"
          fi
